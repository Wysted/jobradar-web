<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a5dbf'/%3E%3Cpath d='M4 5h8M4 8h8M4 11h5' stroke='%23f9fafd' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Scraping Jobs</title>
    <script>
      // Apply theme before first paint. Stored value: 'light' | 'dark'; absent = follow system.
      ;(function () {
        try {
          var stored = localStorage.getItem('scraping_jobs_theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
